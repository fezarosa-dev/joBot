<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:"Noto Sans","Cantarell",sans-serif;color:#1d1d1f;position:relative;
  background:linear-gradient(160deg,#fbfbfd 0%,#f2f3f8 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.b1{width:520px;height:520px;left:-120px;top:-180px;background:rgba(10,132,255,.28)}
.b2{width:560px;height:560px;right:-140px;bottom:-240px;background:rgba(94,92,230,.26)}
.b3{width:340px;height:340px;right:120px;top:-160px;background:rgba(191,90,242,.14)}
.b4{width:300px;height:300px;left:140px;bottom:-170px;background:rgba(100,210,255,.20)}
.wrap{position:absolute;left:80px;right:80px;top:80px;bottom:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.icon{width:112px;height:112px;border-radius:26px;background:linear-gradient(145deg,#4aa3ff 0%,#0a84ff 45%,#5e5ce6 100%);
  box-shadow:0 18px 40px rgba(60,80,200,.28),0 4px 10px rgba(60,80,200,.18),inset 0 1px 0 rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;margin-bottom:26px}
h1{font-size:92px;font-weight:700;letter-spacing:-3.5px;line-height:1;
  background:linear-gradient(180deg,#1d1d1f 30%,#3a3a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:18px;margin-bottom:-4px}
.pt{font-size:30px;font-weight:500;letter-spacing:-.4px;color:#1d1d1f;margin-top:16px}
.en{font-size:21px;font-weight:400;letter-spacing:-.1px;color:#6e6e73;margin-top:10px}
.tags{margin-top:30px;font-size:17px;font-weight:500;letter-spacing:.2px;color:#515154;
  background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.07);border-radius:999px;padding:9px 22px;
  box-shadow:0 2px 8px rgba(0,0,0,.05)}
.url{position:absolute;left:0;right:0;bottom:82px;text-align:center;font-size:15px;color:#8e8e93;letter-spacing:.2px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<div class="wrap">
  <div class="icon">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <path d="M23 18v-3a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v3" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <rect x="7" y="18" width="50" height="35" rx="9" fill="#fff"/>
      <path d="M7 33h50" stroke="#5e7cf0" stroke-opacity=".35" stroke-width="3"/>
      <rect x="27" y="29" width="10" height="9" rx="3" fill="#5e7cf0"/>
    </svg>
  </div>
  <h1>joBot</h1>
  <div class="pt">Busque, filtre e organize vagas de emprego no seu computador.</div>
  <div class="en">Find, filter and organize job openings on your own computer.</div>
  <div class="tags">Local-first · Código aberto · MIT</div>
</div>
<div class="url">github.com/fezarosa-dev/joBot</div>
</body></html>
