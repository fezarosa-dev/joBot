<p class="config-texto">{{ t("configuracoes.aparencia.explicacao") }}</p>
<div class="config-form">
  <form method="post" action="/preferencias/tema" class="campo" data-preferencia="tema">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="voltar" value="/configuracoes/geral">
    <label for="preferencia-tema">{{ t("casca.tema") }}</label>
    <select id="preferencia-tema" name="tema">
      {%- for opcao in ("sistema", "claro", "escuro") %}
      <option value="{{ opcao }}"{% if opcao == tema %} selected{% endif %}>{{ t("casca.tema." ~ opcao) }}</option>
      {%- endfor %}
    </select>
    <noscript><button type="submit" class="botao">{{ t("configuracoes.geral.salvar_escolha") }}</button></noscript>
  </form>
  <form method="post" action="/preferencias/idioma" class="campo" data-preferencia="idioma">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="voltar" value="/configuracoes/geral">
    <label for="preferencia-idioma">{{ t("casca.idioma") }}</label>
    <select id="preferencia-idioma" name="idioma">
      {%- for opcao in ("pt", "en") %}
      <option value="{{ opcao }}" lang="{{ opcao }}"{% if opcao == idioma %} selected{% endif %}>{{ t("casca.idioma." ~ opcao) }}</option>
      {%- endfor %}
    </select>
    <noscript><button type="submit" class="botao">{{ t("configuracoes.geral.salvar_escolha") }}</button></noscript>
  </form>
  <form method="post" action="/preferencias/texto" class="campo" data-preferencia="texto">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="voltar" value="/configuracoes/geral">
    <label for="preferencia-texto">{{ t("configuracoes.geral.texto") }}</label>
    <select id="preferencia-texto" name="tamanho">
      {%- for opcao in ("padrao", "grande", "maior") %}
      <option value="{{ opcao }}"{% if opcao == tamanho_texto %} selected{% endif %}>{{ t("configuracoes.geral.texto." ~ opcao) }}</option>
      {%- endfor %}
    </select>
    <noscript><button type="submit" class="botao">{{ t("configuracoes.geral.salvar_escolha") }}</button></noscript>
  </form>
  <form method="post" action="/configuracoes/geral" class="campo">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="campo">
      <label for="meu_pais">{{ t("configuracoes.aparencia.meu_pais") }}</label>
      <select id="meu_pais" name="meu_pais" aria-describedby="meu_pais-ajuda">
        {%- for codigo, nome in paises %}
        <option value="{{ codigo }}"{% if codigo == meu_pais %} selected{% endif %}>{{ nome }}</option>
        {%- endfor %}
      </select>
      <small id="meu_pais-ajuda">{{ t("configuracoes.aparencia.ajuda_pais") }}</small>
    </div>
    <div class="campo">
      <label for="moeda_exibicao">{{ t("configuracoes.aparencia.moeda") }}</label>
      <select id="moeda_exibicao" name="moeda_exibicao">
        <option value=""{% if not moeda_exibicao %} selected{% endif %}>{{ t("configuracoes.aparencia.moeda_do_pais", moeda=moeda_do_pais) }}</option>
        {%- for moeda in moedas %}
        <option value="{{ moeda }}"{% if moeda == moeda_exibicao %} selected{% endif %}>{{ moeda }}</option>
        {%- endfor %}
      </select>
    </div>
    <div class="acoes">
      <button type="submit" class="botao botao-primario">{{ t("configuracoes.salvar") }}</button>
    </div>
  </form>
</div>
{#- Encerrar (T333; desenho 6.4): abre o alerta que vem com a paleta; sem JavaScript, a confirmação -#}
<form method="get" action="/sair/confirmar">
  <input type="hidden" name="voltar" value="/configuracoes/geral">
  <div class="acoes">
    <button type="submit" class="botao botao-secundario" data-alerta-abre="alerta-encerrar">{{ t("execucao.encerrar") }}</button>
  </div>
</form>
