<p class="config-texto">{{ t("configuracoes.aparencia.explicacao") }}</p>
<div class="config-form">
  <form method="post" action="/preferencias/tema" class="campo" data-preferencia="tema">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="voltar" value="/configuracoes/aparencia">
    <fieldset class="campo">
      <legend>{{ t("casca.tema") }}</legend>
      <div class="opcoes">
        {%- for opcao in ("sistema", "claro", "escuro") %}
        <button type="submit" name="tema" value="{{ opcao }}" class="botao botao-escolha" aria-pressed="{{ 'true' if opcao == tema else 'false' }}">{{ t("casca.tema." ~ opcao) }}</button>
        {%- endfor %}
      </div>
    </fieldset>
  </form>
  <form method="post" action="/preferencias/idioma" class="campo" data-preferencia="idioma">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="voltar" value="/configuracoes/aparencia">
    <fieldset class="campo">
      <legend>{{ t("casca.idioma") }}</legend>
      <div class="opcoes">
        {%- for opcao in ("pt", "en") %}
        <button type="submit" name="idioma" value="{{ opcao }}" lang="{{ opcao }}" class="botao botao-escolha" aria-pressed="{{ 'true' if opcao == idioma else 'false' }}">{{ t("casca.idioma." ~ opcao) }}</button>
        {%- endfor %}
      </div>
    </fieldset>
  </form>
  <form method="post" action="/configuracoes/aparencia" class="campo">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="campo">
      <label for="meu_pais">{{ t("configuracoes.aparencia.meu_pais") }}</label>
      <select id="meu_pais" name="meu_pais" aria-describedby="meu_pais-ajuda">
        {%- for codigo, nome in paises %}
        <option value="{{ codigo }}"{% if codigo == meu_pais %} selected{% endif %}>{{ nome }}</option>
        {%- endfor %}
      </select>
      <small id="meu_pais-ajuda">{{ t("configuracoes.aparencia.ajuda_pais") }}</small>
    </div>
    <div class="campo">
      <label for="moeda_exibicao">{{ t("configuracoes.aparencia.moeda") }}</label>
      <select id="moeda_exibicao" name="moeda_exibicao">
        <option value=""{% if not moeda_exibicao %} selected{% endif %}>{{ t("configuracoes.aparencia.moeda_do_pais", moeda=moeda_do_pais) }}</option>
        {%- for moeda in moedas %}
        <option value="{{ moeda }}"{% if moeda == moeda_exibicao %} selected{% endif %}>{{ moeda }}</option>
        {%- endfor %}
      </select>
    </div>
    <div class="acoes">
      <button type="submit" class="botao botao-primario">{{ t("configuracoes.salvar") }}</button>
    </div>
  </form>
</div>
