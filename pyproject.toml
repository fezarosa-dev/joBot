[build-system]
requires = ["uv_build>=0.12.3,<0.14"]
build-backend = "uv_build"

[project]
name = "jobot"
version = "0.1.0"
description = "Busca vagas em fontes públicas e mostra num painel local."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.33",
  "httpx==0.28.1",
  "selectolax==1.0.2",
]

[project.scripts]
jobot = "jobot.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-playwright==0.10.0",
  "playwright==1.65.1",
  "mypy==2.4.1",
  "ruff==0.17.5",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# o ruff 0.17 formata blocos de código dentro de Markdown; os documentos ficam fora
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["tela: teste de tela com Playwright (precisa do Chromium do Playwright: uv run playwright install chromium)"]
