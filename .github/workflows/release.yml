name: Release

# Publica a versão (desenho 8; D174). Na tag vN.N.N, o pacotes.yml monta e testa (fumaça sem
# rede e a casca aberta num Xvfb, T355) os instaladores, os pacotes de atualização, a wheel e o restricoes.txt (sem o navegador:
# o joBot não redistribui o Chrome for Testing do Playwright, D183.24), e o job juntar dele põe tudo, o SHA256SUMS e as notas (a seção da versão no
# CHANGELOG.md e no CHANGELOG.en.md) no artefato release. O job publicar só confere o
# SHA256SUMS e cria a release (não rascunho, não prerelease, para virar a latest que o
# versao.py lê) com esse artefato: o resto já passou pelo ensaio do casca.yml. À mão
# (workflow_dispatch) é sempre ensaio: monta e testa, nunca publica. Só aqui há contents: write, e só no job publicar; o único segredo é o
# GITHUB_TOKEN. Sem gatilho de pull request (ADR 0018: o CI de PR não tem segredo nem escrita).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Portão (pedido do dono, 2026-11-25): a tag só publica se o mesmo código passou no CI
  # inteiro e no ensaio da Casca com pacotes e ia=true. Compara a árvore, não o sha: o CI do
  # PR roda no commit da dev, que tem a mesma árvore do merge na main. Sem isso, falha.
  portao:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: CI e ensaio verdes na árvore da tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          arvore() { gh api "repos/$GITHUB_REPOSITORY/git/commits/$1" --jq .tree.sha; }
          alvo=$(arvore "$GITHUB_SHA")
          # verde <fluxo> <filtro jq dos jobs, vazio = basta o run verde>
          verde() {
            local id sha
            while read -r id sha; do
              [ "$(arvore "$sha")" = "$alvo" ] || continue
              [ -z "$2" ] && return 0
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq "$2" | grep -q . && return 0
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?status=success&per_page=100" \
                       --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
            return 1
          }
          verde ci.yml '' || { echo "::error::nenhum CI verde na árvore $alvo da tag"; exit 1; }
          verde casca.yml '[.jobs[] | select(.conclusion == "success") | .name]
            | select(any(startswith("pacotes / juntar")) and any(startswith("ia"))) | "ok"' \
            || { echo "::error::nenhum ensaio da Casca com pacotes e ia=true verde na árvore $alvo da tag"; exit 1; }
          echo "CI e ensaio verdes na árvore $alvo"

  pacotes:
    uses: ./.github/workflows/pacotes.yml

  publicar:
    needs: [portao, pacotes]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: publicar
        working-directory: release/anexos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "joBot $GITHUB_REF_NAME" --notes-file ../notas.md -- *
