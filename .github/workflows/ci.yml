name: CI

# Roda em todo pull request, de qualquer ramo (ADR 0018): o repositório é
# público, o runner padrão não custa minutos e PR de fork precisa de teste.
# Gatilho pull_request, nunca pull_request_target; sem segredos.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m 'not tela'
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m tela
