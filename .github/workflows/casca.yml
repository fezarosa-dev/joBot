name: Casca

# A casca de desktop (Tauri, pasta desktop/). Mesmos gatilhos do ci.yml (ADR 0018):
# todo pull request, push em lote/** e workflow_dispatch. Gatilho pull_request,
# nunca pull_request_target; sem segredos.
# O job casca roda no ubuntu-22.04 (WebKitGTK mais velho que se espera achar): fmt,
# clippy, testes e build. O painel não abre mais na janela (D206, ADR 0027): a prova da
# IPC no painel em http://127.0.0.1 (T321) saiu. O job windows roda os testes de sistema
# no Windows (desenho 10) e o clippy e os testes da casca, que passam pelos ramos
# #[cfg(windows)].
# Só no workflow_dispatch: o job uv (prova do uv com hash, T322 e D173) nos três
# sistemas e, com a entrada pacotes, o job pacotes: o mesmo pacotes.yml da release
# (instaladores, fumaça sem rede, T339, e a casca aberta num Xvfb, T355), sem publicar; com a entrada ia, o job ia: o ia.yml
# (o modelo local de verdade nos três sistemas, T410).
on:
  pull_request:
  push:
    branches: ['lote/**']
  workflow_dispatch:
    inputs:
      pacotes:
        description: Gera os instaladores, sem publicar
        type: boolean
        default: false
      ia:
        description: Prova o modelo local de verdade (T410)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: casca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  casca:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: |
          canal=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$canal"
          rustup toolchain install "$canal" --profile minimal --component rustfmt --component clippy
          rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: casca-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unidade -k "pastas or instancia or processo or segundo_plano or atualizar or cofre or nofollow"
      - name: rust
        shell: bash
        working-directory: desktop
        run: |
          canal=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$canal"
          rustup toolchain install "$canal" --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: casca-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop

  uv:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run python scripts/provar_uv.py

  pacotes:
    if: github.event_name == 'workflow_dispatch' && inputs.pacotes
    uses: ./.github/workflows/pacotes.yml

  ia:
    if: github.event_name == 'workflow_dispatch' && inputs.ia
    uses: ./.github/workflows/ia.yml
