name: Pacotes

# Monta e testa os instaladores da casca, sem publicar (desenho 8 e 10; D174). Só é chamado:
# pelo release.yml (que publica na tag) e pelo casca.yml (workflow_dispatch com pacotes). Só
# leitura e sem segredo.
# wheel: a versão do pyproject (na tag, tem de ser a da tag), a wheel do joBot, o
#   dependencias.txt (uv export do uv.lock, com hash) e o restricoes.txt (o mesmo mais a linha
#   jobot==<versão> --hash=..., D174.16).
# casca (um runner por alvo, D174.11): baixa as wheels do alvo, só binárias e com
#   --require-hashes; gera o Chromium pelo playwright install --no-shell da versão do uv.lock
#   (sem o headless shell: o joBot só abre com janela, D183); monta
#   desktop/recursos/ com o scripts/montar_recursos.py (uv, licenças do uv e Python conferidos
#   contra o desktop/uv.meta.json, Chromium sem o Widevine, D183.24, manifesto.json com o
#   sha256 de cada arquivo) e o pacote de atualização; no Linux, põe no cache do Tauri as
#   ferramentas do AppImage conferidas pelo desktop/appimage.meta.json; compila com
#   JOBOT_MANIFESTO_SHA256 e o Cargo.lock; e roda a fumaça (jobot-app --verificar instala dos
#   recursos, sobe o servidor e abre o Chromium completo, channel="chromium", em headless):
#   Linux: imagem ubuntu:22.04 com as bibliotecas que o .deb declara e as do Chromium (o único
#     passo com rede), depois o .deb (dpkg -i) e o AppImage em docker run --network none, o
#     --verificar como usuário comum; o AppImage de novo numa ubuntu:24.04.
#   Windows: regra de firewall de saída por caminho para o instalador e todo .exe que a
#     instalação vai ter, criadas antes do /S; todo .exe da instalação e do Chromium precisa
#     de regra (antes e depois do --verificar); controle: o Python do venv não sai e o do
#     runner sai. Depois, a troca pela tela normal (o desinstalador velho no lugar, _?=, que
#     não apaga o venv, D182.5) e a reinstalação; por fim desinstala (a pasta da casca e o
#     instalacao.json saem, a pasta de dados fica).
#   Mac: o .app de dentro do .dmg, com rede (limite: o runner não deixa isolar um processo).
# juntar: os anexos da release (16 arquivos), o SHA256SUMS e as notas (a seção da versão dos
#   dois CHANGELOGs) num artefato release; o publicar do release.yml só cria a release com ele,
#   então o ensaio pelo casca.yml prova tudo menos o gh release create.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      - name: versão
        id: versao
        run: |
          versao=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          echo "pyproject: $versao; ref: $GITHUB_REF_NAME"
          test -n "$versao"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            test "v$versao" = "$GITHUB_REF_NAME"
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
      - run: uv build --wheel --out-dir dist
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file dist/dependencias.txt
      - run: uv run --no-project --python 3.14.10 python scripts/montar_recursos.py restricoes --dependencias dist/dependencias.txt --wheel dist/jobot-*.whl --saida dist/restricoes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/
          if-no-files-found: error
          retention-days: 2

  casca:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            alvo: x86_64-unknown-linux-gnu
            pacotes: deb,rpm,appimage
          - os: windows-latest
            alvo: x86_64-pc-windows-msvc
            pacotes: nsis
          - os: macos-latest
            alvo: aarch64-apple-darwin
            pacotes: app,dmg
          - os: macos-15-intel
            alvo: x86_64-apple-darwin
            pacotes: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ALVO: ${{ matrix.alvo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: rust
        working-directory: desktop
        run: |
          canal=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$canal"
          rustup toolchain install "$canal" --profile minimal
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      - name: wheels do alvo
        run: |
          uvx --python 3.14 pip==26.2 download --only-binary=:all: --require-hashes -r dist/dependencias.txt -d "$RUNNER_TEMP/rodas"
      - name: chromium
        run: |
          uv sync --locked --no-dev
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/navegadores" uv run --no-dev playwright install --no-shell chromium
      - name: recursos
        run: |
          sha=$(uv run --no-project --python 3.14.10 python scripts/montar_recursos.py recursos \
            --alvo "$ALVO" --wheel dist/jobot-*.whl --restricoes dist/restricoes.txt \
            --rodas "$RUNNER_TEMP/rodas" --navegadores "$RUNNER_TEMP/navegadores" \
            --saida desktop/recursos --pacotes saida | tr -d '\r')
          test "${#sha}" = 64
          echo "JOBOT_MANIFESTO_SHA256=$sha" >> "$GITHUB_ENV"
          echo "$ALVO: manifesto.json $sha" >> "$GITHUB_STEP_SUMMARY"
          du -sh desktop/recursos saida/*
      - run: cargo install tauri-cli --version =2.12.4 --locked
        working-directory: desktop
      - name: ferramentas do AppImage
        if: runner.os == 'Linux'
        run: |
          uv run --no-project --python 3.14.10 python scripts/montar_recursos.py ferramentas --saida "${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
      - run: cargo tauri build --bundles ${{ matrix.pacotes }} -- --locked
        working-directory: desktop
      - name: juntar
        run: |
          b=desktop/target/release/bundle
          case "$ALVO" in
            *linux*) cp "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage saida/ ;;
            *windows*) cp "$b"/nsis/*-setup.exe saida/ ;;
            *) cp "$b"/dmg/*.dmg saida/ ;;
          esac
          cp desktop/recursos/chromium-*.tar.gz saida/
          ls -la saida
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: casca-${{ matrix.alvo }}
          path: saida/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: fumaça sem rede (Linux)
        if: runner.os == 'Linux'
        run: |
          imagem="$RUNNER_TEMP/imagem"
          mkdir -p "$imagem"
          cp -r .venv/lib/python3.14/site-packages/playwright/driver "$imagem/driver"
          cat > "$imagem/Dockerfile" <<'FIM'
          ARG BASE
          FROM $BASE
          ARG DEPS
          ENV DEBIAN_FRONTEND=noninteractive
          COPY driver /tmp/driver
          RUN apt-get update \
           && apt-get satisfy -y --no-install-recommends "$DEPS" \
           && /tmp/driver/node /tmp/driver/package/cli.js install-deps chromium \
           && rm -rf /tmp/driver /var/lib/apt/lists/* \
           && useradd -m pessoa
          FIM
          deps=$(dpkg-deb -f saida/*.deb Depends)
          echo "Depends do .deb: $deps"
          docker build -t jobot-fumaca --build-arg BASE=ubuntu:22.04 --build-arg DEPS="$deps" "$imagem"
          # na 24.04 só o WebKitGTK do sistema (os nomes t64 não casam com o Depends da 22.04)
          docker build -t jobot-fumaca-nova --build-arg BASE=ubuntu:24.04 --build-arg DEPS=libwebkit2gtk-4.1-0 "$imagem"
          # dpkg -i como root; o --verificar como usuário comum, que não lê o que não é dele
          docker run --rm --network none -v "$PWD/saida:/saida:ro" jobot-fumaca \
            sh -c 'dpkg -i /saida/*.deb && runuser -u pessoa -- jobot-app --verificar'
          appimage='cp /saida/*.AppImage /tmp/jobot.AppImage && chmod 755 /tmp/jobot.AppImage && cd /tmp \
            && ./jobot.AppImage --appimage-extract AppRun >/dev/null \
            && echo "o AppRun exporta: $(grep -ao "LD_LIBRARY_PATH=[^[:cntrl:]]*" squashfs-root/AppRun | head -n 1)" \
            && rm -rf squashfs-root && runuser -u pessoa -- ./jobot.AppImage --verificar'
          docker run --rm --network none -v "$PWD/saida:/saida:ro" -e APPIMAGE_EXTRACT_AND_RUN=1 jobot-fumaca sh -c "$appimage"
          docker run --rm --network none -v "$PWD/saida:/saida:ro" -e APPIMAGE_EXTRACT_AND_RUN=1 jobot-fumaca-nova sh -c "$appimage"

      - name: fumaça sem rede (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = Join-Path $env:LOCALAPPDATA 'joBot'
          $pw = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          $setup = (Get-ChildItem saida -Filter '*-setup.exe').FullName
          $exes = @(uv run --no-project --python 3.14.10 python scripts/montar_recursos.py exes --recursos desktop/recursos --instalacao $inst --playwright $pw)
          if ($LASTEXITCODE -ne 0 -or $exes.Count -eq 0) { throw 'não deu para listar os .exe' }
          # o próprio instalador também: é ele que baixaria o WebView2 (D183)
          $exes = @($setup) + $exes
          foreach ($exe in $exes) {
            New-NetFirewallRule -Direction Outbound -Action Block -Program $exe -DisplayName "jobot-fumaca $exe" | Out-Null
          }
          Write-Output "$($exes.Count) regras de saída"
          $com = $exes | ForEach-Object { $_.ToLowerInvariant() }
          function Conferir-Regras {
            $achados = @(Get-ChildItem $inst -Recurse -Filter '*.exe' -File)
            if (Test-Path $pw) { $achados += @(Get-ChildItem $pw -Recurse -Filter '*.exe' -File) }
            # o cache do uv guarda cópias que ninguém roda
            $conferidos = @($achados | Where-Object { $_.FullName -notlike "$inst\app\cache\*" })
            $sem = @($conferidos | Where-Object { $com -notcontains $_.FullName.ToLowerInvariant() })
            foreach ($s in $sem) { Write-Output "sem regra: $($s.FullName)" }
            if ($sem.Count -gt 0) { throw 'há .exe sem regra de firewall' }
            Write-Output "$($conferidos.Count) .exe conferidos, todos com regra"
          }
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalador: $($p.ExitCode)" }
          Conferir-Regras
          $saida = Join-Path $env:RUNNER_TEMP 'verificar'
          $v = Start-Process (Join-Path $inst 'jobot-app.exe') -ArgumentList '--verificar' -Wait -PassThru `
            -RedirectStandardOutput "$saida.out" -RedirectStandardError "$saida.err"
          Get-Content "$saida.out", "$saida.err"
          if ($v.ExitCode -ne 0) { throw "--verificar: $($v.ExitCode)" }
          Conferir-Regras
          # controle: sem ele, firewall desligado ou regra com caminho que não casa passariam
          $teste = 'import socket, sys; print(sys.executable); socket.create_connection(("github.com", 443), timeout=15).close()'
          $venvs = @(Get-ChildItem (Join-Path $inst 'app\venvs') -Directory)
          if ($venvs.Count -ne 1) { throw "venvs: $($venvs.Count)" }
          $venvpy = Join-Path $venvs[0].FullName 'Scripts\python.exe'
          $bloqueado = @(& $venvpy -c $teste 2>&1 | ForEach-Object { "$_" })
          if ($LASTEXITCODE -eq 0) { throw 'o Python do venv saiu para a rede: as regras não bloqueiam' }
          $bloqueado | Select-Object -Last 3
          # WSAEACCES: a conexão foi recusada pela regra, não por outro motivo
          if (-not ($bloqueado -match 'WinError 10013')) { throw 'o Python do venv falhou, mas não pelo firewall' }
          uv run --no-project --python 3.14 python -c $teste
          if ($LASTEXITCODE -ne 0) { throw 'o Python do runner, sem regra, não saiu: o controle não vale' }
          Write-Output 'controle: o Python do venv não sai, o do runner sai'
          # troca pela tela normal: a PageLeaveReinstall do Tauri roda o desinstalador velho no
          # lugar (_?=), o gancho não chama o --desinstalar e o venv fica (D182.5). Em /S o
          # instalador pula essa página, então a fumaça faz o mesmo passo à mão.
          $un = Join-Path $inst 'uninstall.exe'
          $p = Start-Process $un -ArgumentList '/S', "_?=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "desinstalador no lugar: $($p.ExitCode)" }
          if (Test-Path (Join-Path $inst 'jobot-app.exe')) { throw 'o desinstalador no lugar deixou a casca' }
          foreach ($fica in 'app\venvs', 'instalacao.json') {
            if (-not (Test-Path (Join-Path $inst $fica))) { throw "a troca apagou $fica" }
          }
          Remove-Item $un
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstalar: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $inst 'app\venvs'))) { throw 'a reinstalação apagou o venv' }
          # desinstalar de verdade: o NSIS se copia para o temporário e o gancho chama --desinstalar
          Start-Process $un -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 120 -and (Test-Path $un); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $un) { throw 'o desinstalador não terminou' }
          if (Test-Path (Join-Path $inst 'app')) { throw 'a desinstalação deixou a pasta da casca' }
          if (Test-Path (Join-Path $inst 'instalacao.json')) { throw 'a desinstalação deixou o instalacao.json' }
          if (-not (Test-Path (Join-Path $inst 'jobot.db'))) { throw 'a desinstalação apagou o banco' }
          Get-ChildItem $inst | Select-Object -ExpandProperty Name

      - name: fumaça (Mac, com rede)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" saida/*.dmg
          cp -R "$RUNNER_TEMP/dmg/joBot.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/joBot.app/Contents/MacOS/jobot-app" --verificar

  juntar:
    needs: [wheel, casca]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: baixados
          merge-multiple: true
      - name: anexos e notas
        env:
          VERSAO: ${{ needs.wheel.outputs.versao }}
        run: |
          shopt -s failglob
          mkdir -p release/anexos
          cd baixados
          anexos=(*-setup.exe *.dmg *.deb *.rpm *.AppImage jobot-atualizacao-*.zip chromium-*.tar.gz jobot-*.whl restricoes.txt)
          # 1 .exe, 2 .dmg, .deb, .rpm, AppImage, 4 pacotes, 4 Chromium, a wheel e o restricoes.txt
          test "${#anexos[@]}" = 16
          mv -- "${anexos[@]}" ../release/anexos/
          cd ../release/anexos
          sha256sum -- "${anexos[@]}" > SHA256SUMS
          cat SHA256SUMS
          ls -la
          cd "$GITHUB_WORKSPACE"
          secao() { awk -v v="## [$VERSAO]" 'index($0, v) == 1 {p = 1; next} /^## / {p = 0} p' "$1"; }
          for changelog in CHANGELOG.md CHANGELOG.en.md; do
            secao "$changelog" | grep -q '[^[:space:]]' || { echo "sem a seção $VERSAO no $changelog"; exit 1; }
          done
          { secao CHANGELOG.md; echo; echo '---'; echo; secao CHANGELOG.en.md; } > release/notas.md
          cat release/notas.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
