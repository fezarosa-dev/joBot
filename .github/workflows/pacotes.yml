name: Pacotes

# Monta e testa os instaladores da casca, sem publicar (desenho 8 e 10; D174). Só é chamado:
# pelo release.yml (que publica na tag) e pelo casca.yml (workflow_dispatch com pacotes). Só
# leitura e sem segredo.
# wheel: a wheel do joBot, o dependencias.txt (uv export do uv.lock, com hash) e o
#   restricoes.txt (o mesmo mais a linha jobot==<versão> --hash=..., D174.16).
# casca (um runner por alvo, D174.11): baixa as wheels do alvo, só binárias e com
#   --require-hashes; gera o Chromium pelo playwright install da versão do uv.lock; monta
#   desktop/recursos/ com o scripts/montar_recursos.py (uv e Python conferidos contra o
#   desktop/uv.meta.json, manifesto.json com o sha256 de cada arquivo) e o pacote de
#   atualização; compila com JOBOT_MANIFESTO_SHA256; e roda a fumaça (jobot-app --verificar
#   instala dos recursos, sobe o servidor e abre o Chromium headless):
#   Linux: imagem ubuntu:22.04 com as bibliotecas que o .deb declara e as do Chromium (o único
#     passo com rede), depois o .deb (dpkg -i) e o AppImage em docker run --network none.
#   Windows: regra de firewall de saída por caminho para todo .exe que a instalação vai ter,
#     criadas antes do /S; todo .exe da instalação e do Chromium precisa de regra (antes e
#     depois do --verificar); depois reinstala (a troca não apaga o venv, D182.5) e desinstala
#     (a pasta da casca e o instalacao.json saem, a pasta de dados fica).
#   Mac: o .app de dentro do .dmg, com rede (limite: o runner não deixa isolar um processo).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versao=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          echo "pyproject: $versao; tag: $GITHUB_REF_NAME"
          test "v$versao" = "$GITHUB_REF_NAME"
      - run: uv build --wheel --out-dir dist
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file dist/dependencias.txt
      - run: uv run --no-project --python 3.14 python scripts/montar_recursos.py restricoes --dependencias dist/dependencias.txt --wheel dist/jobot-*.whl --saida dist/restricoes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/
          if-no-files-found: error

  casca:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            alvo: x86_64-unknown-linux-gnu
            pacotes: deb,rpm,appimage
          - os: windows-latest
            alvo: x86_64-pc-windows-msvc
            pacotes: nsis
          - os: macos-latest
            alvo: aarch64-apple-darwin
            pacotes: app,dmg
          - os: macos-15-intel
            alvo: x86_64-apple-darwin
            pacotes: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ALVO: ${{ matrix.alvo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: rust
        working-directory: desktop
        run: |
          canal=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$canal"
          rustup toolchain install "$canal" --profile minimal
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      - name: wheels do alvo
        run: uvx --python 3.14 pip==26.2 download --only-binary=:all: --require-hashes -r dist/dependencias.txt -d "$RUNNER_TEMP/rodas"
      - name: chromium
        run: |
          uv sync --locked --no-dev
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/navegadores" uv run --no-dev playwright install chromium
      - name: recursos
        run: |
          sha=$(uv run --no-project --python 3.14 python scripts/montar_recursos.py recursos \
            --alvo "$ALVO" --wheel dist/jobot-*.whl --restricoes dist/restricoes.txt \
            --rodas "$RUNNER_TEMP/rodas" --navegadores "$RUNNER_TEMP/navegadores" \
            --saida desktop/recursos --pacotes saida | tr -d '\r')
          test "${#sha}" = 64
          echo "JOBOT_MANIFESTO_SHA256=$sha" >> "$GITHUB_ENV"
          echo "$ALVO: manifesto.json $sha" >> "$GITHUB_STEP_SUMMARY"
          du -sh desktop/recursos saida/*
      - run: cargo install tauri-cli --version =2.12.4 --locked
        working-directory: desktop
      - run: cargo tauri build --bundles ${{ matrix.pacotes }}
        working-directory: desktop
      - name: juntar
        run: |
          b=desktop/target/release/bundle
          case "$ALVO" in
            *linux*) cp "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage saida/ ;;
            *windows*) cp "$b"/nsis/*-setup.exe saida/ ;;
            *) cp "$b"/dmg/*.dmg saida/ ;;
          esac
          cp desktop/recursos/chromium-*.tar.gz saida/
          ls -la saida
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: casca-${{ matrix.alvo }}
          path: saida/
          if-no-files-found: error
          compression-level: 0

      - name: fumaça sem rede (Linux)
        if: runner.os == 'Linux'
        run: |
          imagem="$RUNNER_TEMP/imagem"
          mkdir -p "$imagem"
          cp -r .venv/lib/python3.14/site-packages/playwright/driver "$imagem/driver"
          cat > "$imagem/Dockerfile" <<'FIM'
          FROM ubuntu:22.04
          ARG DEPS
          ENV DEBIAN_FRONTEND=noninteractive
          COPY driver /tmp/driver
          RUN apt-get update \
           && apt-get satisfy -y --no-install-recommends "$DEPS" \
           && /tmp/driver/node /tmp/driver/package/cli.js install-deps chromium \
           && rm -rf /tmp/driver /var/lib/apt/lists/*
          FIM
          deps=$(dpkg-deb -f saida/*.deb Depends)
          echo "Depends do .deb: $deps"
          docker build -t jobot-fumaca --build-arg DEPS="$deps" "$imagem"
          docker run --rm --network none -v "$PWD/saida:/saida:ro" jobot-fumaca \
            sh -c 'dpkg -i /saida/*.deb && jobot-app --verificar'
          docker run --rm --network none -v "$PWD/saida:/saida:ro" -e APPIMAGE_EXTRACT_AND_RUN=1 jobot-fumaca \
            sh -c 'cp /saida/*.AppImage /tmp/jobot.AppImage && chmod +x /tmp/jobot.AppImage && cd /tmp && ./jobot.AppImage --verificar'

      - name: fumaça sem rede (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = Join-Path $env:LOCALAPPDATA 'joBot'
          $pw = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          $exes = @(uv run --no-project --python 3.14 python scripts/montar_recursos.py exes --recursos desktop/recursos --instalacao $inst --playwright $pw)
          if ($LASTEXITCODE -ne 0 -or $exes.Count -eq 0) { throw 'não deu para listar os .exe' }
          foreach ($exe in $exes) {
            New-NetFirewallRule -Direction Outbound -Action Block -Program $exe -DisplayName "jobot-fumaca $exe" | Out-Null
          }
          Write-Output "$($exes.Count) regras de saída"
          $com = $exes | ForEach-Object { $_.ToLowerInvariant() }
          function Conferir-Regras {
            $achados = @(Get-ChildItem $inst -Recurse -Filter '*.exe' -File)
            if (Test-Path $pw) { $achados += @(Get-ChildItem $pw -Recurse -Filter '*.exe' -File) }
            # o cache do uv guarda cópias que ninguém roda
            $sem = @($achados | Where-Object { $_.FullName -notlike "$inst\app\cache\*" -and $com -notcontains $_.FullName.ToLowerInvariant() })
            foreach ($s in $sem) { Write-Output "sem regra: $($s.FullName)" }
            if ($sem.Count -gt 0) { throw 'há .exe sem regra de firewall' }
            Write-Output "$($achados.Count) .exe, todos com regra"
          }
          $setup = (Get-ChildItem saida -Filter '*-setup.exe').FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalador: $($p.ExitCode)" }
          Conferir-Regras
          $saida = Join-Path $env:RUNNER_TEMP 'verificar'
          $v = Start-Process (Join-Path $inst 'jobot-app.exe') -ArgumentList '--verificar' -Wait -PassThru `
            -RedirectStandardOutput "$saida.out" -RedirectStandardError "$saida.err"
          Get-Content "$saida.out", "$saida.err"
          if ($v.ExitCode -ne 0) { throw "--verificar: $($v.ExitCode)" }
          Conferir-Regras
          # troca: o instalador de novo não roda o gancho de desinstalar, o venv fica (D182.5)
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstalar: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $inst 'app\venvs'))) { throw 'a reinstalação apagou o venv' }
          # desinstalar de verdade: o NSIS se copia para o temporário e o gancho chama --desinstalar
          $un = Join-Path $inst 'uninstall.exe'
          Start-Process $un -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 120 -and (Test-Path $un); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $un) { throw 'o desinstalador não terminou' }
          if (Test-Path (Join-Path $inst 'app')) { throw 'a desinstalação deixou a pasta da casca' }
          if (Test-Path (Join-Path $inst 'instalacao.json')) { throw 'a desinstalação deixou o instalacao.json' }
          if (-not (Test-Path $inst)) { throw 'a desinstalação apagou a pasta de dados' }
          Get-ChildItem $inst | Select-Object -ExpandProperty Name

      - name: fumaça (Mac, com rede)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" saida/*.dmg
          cp -R "$RUNNER_TEMP/dmg/joBot.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/joBot.app/Contents/MacOS/jobot-app" --verificar
