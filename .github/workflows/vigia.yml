name: Vigia

# Vigia semanal das fontes (T84, ADR 0018): testa de verdade um escopo de cada fonte pública,
# com no máximo 5 pedidos por fonte (ADR 0004), e abre uma issue com o rótulo fonte-quebrada
# quando uma quebra. Só roda pelo agendamento e à mão, nunca em PR. Sem segredo do repositório:
# usa só o token que o Actions entrega, e só nos pedidos à API do GitHub.
# O agendamento só vale no ramo padrão (main), e o GitHub o desliga em repositório público sem
# atividade por 60 dias; religa-se pela tela de Actions ou rodando à mão (D31).
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    # as fontes rodam uma de cada vez, cada escopo com prazo de 5 minutos
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # o job não usa git; o token não fica no .git/config
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/vigia.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
