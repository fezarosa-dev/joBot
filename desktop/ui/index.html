<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joBot</title>
<!-- Desenho 5.2 (T336): a tela de instalação da casca. O CSS, as fontes e o ícone do painel
     chegam em painel/ pelo build.rs (pasta gitignored); os textos vêm de i18n/{pt,en}.json e a
     conversa com a casca fica no instalador.js. -->
<link rel="stylesheet" href="painel/css/base.css">
<link rel="stylesheet" href="painel/css/execucao.css">
<style>
  html, body { block-size: 100%; }
  body { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* janela sem moldura (Windows e Linux): a faixa do topo arrasta, o botão não */
  .arrastar {
    flex: none; display: flex; justify-content: flex-end; align-items: center;
    block-size: 40px; padding-inline: 8px; -webkit-app-region: drag;
  }
  .arrastar button { -webkit-app-region: no-drag; }
  /* pé preso (D144): só o corpo do passo rola; os botões nunca saem da janela */
  .instalador {
    flex: 1 1 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto;
    min-block-size: 0; inline-size: min(100% - 2rem, 40rem); margin-inline: auto;
    padding-block-end: 1rem;
  }
  .instalador-corpo {
    min-block-size: 0; overflow-y: auto; padding-inline: 0.25rem; margin-inline: -0.25rem;
  }
  .instalador-pe {
    flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem;
    align-items: center; padding-block-start: 0.75rem;
    border-block-start: 1px solid var(--separador);
  }
  .instalador-pe .instalador-voltar { margin-inline-end: auto; }
  .instalador-pe button { min-block-size: 2rem; padding-inline: 1rem; }
  .marca-grande { inline-size: 64px; block-size: 64px; margin-block-start: 1rem; }
  h1, h2 { margin: 0.5rem 0; font: var(--t-title1); }
  h2:focus { outline: none; }
  .texto-2 { color: var(--texto-2); }
  .campo-idioma { display: inline-flex; gap: 0.5rem; align-items: center; margin-block: 0.5rem 1rem; }
  .ferramentas { display: grid; gap: 0.75rem; margin: 0 0 1rem; padding: 0; list-style: none; }
  .ferramenta {
    display: grid; grid-template-columns: auto 1fr auto; gap: 0.25rem 0.6rem; align-items: center;
    padding: 0.75rem 1rem; border: 1px solid var(--borda); border-radius: var(--raio);
    background-color: var(--superficie);
  }
  .ferramenta label { font-weight: 500; }
  .ferramenta .ferramenta-tamanho { color: var(--texto-2); font: var(--t-sub); }
  .ferramenta .ferramenta-frase { grid-column: 2 / -1; margin: 0; color: var(--texto-2); font: var(--t-sub); }
  .instalador-rodape {
    display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 0;
    color: var(--texto-2); font: var(--t-sub);
  }
  .instalador-rodape dd { margin: 0; overflow-wrap: anywhere; }
  .progresso-corpo { inline-size: 100%; margin-block: 1rem; }
  .falha-detalhe { margin-block-start: 1rem; color: var(--texto-2); font: var(--t-sub); }
  .falha-detalhe pre {
    max-block-size: 12rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .so-leitor {
    position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="arrastar" data-tauri-drag-region>
  <button type="button" id="fechar-janela" class="botao-simples" data-t="fechar"></button>
</div>
<main class="instalador">
  <div class="instalador-corpo">
    <section data-passo="boas-vindas" hidden>
      <img class="marca-grande" src="painel/icone.png" alt="">
      <h1 tabindex="-1">joBot</h1>
      <p class="texto-2" data-t="frase"></p>
      <label class="campo-idioma"><span data-t="idioma"></span>
        <select id="idioma">
          <option value="pt">Português</option>
          <option value="en">English</option>
        </select>
      </label>
    </section>

    <section data-passo="ferramentas" hidden>
      <h2 tabindex="-1" data-t="ferramentas.titulo"></h2>
      <ul class="ferramentas">
        <li class="ferramenta">
          <input type="checkbox" id="ferramenta-jobot" checked disabled>
          <label for="ferramenta-jobot"><span data-t="ferramentas.jobot"></span>
            <span class="texto-2">(<span data-t="ferramentas.necessario"></span>)</span></label>
          <span class="ferramenta-tamanho" id="tamanho-jobot"></span>
        </li>
        <li class="ferramenta">
          <input type="checkbox" id="ferramenta-navegador" checked aria-describedby="frase-navegador">
          <label for="ferramenta-navegador" data-t="ferramentas.navegador"></label>
          <span class="ferramenta-tamanho" id="tamanho-navegador"></span>
          <p class="ferramenta-frase" id="frase-navegador" data-t="ferramentas.navegador_frase"></p>
        </li>
      </ul>
      <dl class="instalador-rodape" id="rodape">
        <dt data-t="rodape.onde"></dt><dd id="onde-fica"></dd>
        <dt data-t="rodape.espaco"></dt><dd id="espaco"></dd>
      </dl>
    </section>

    <section data-passo="instalando" hidden>
      <h2 tabindex="-1" data-t="instalando.titulo"></h2>
      <!-- o mesmo markup do componente de progresso do painel (execucao/_progresso.html) -->
      <div class="progresso progresso-corpo">
        <div class="progresso-trilho" id="trilho" role="progressbar" data-t-rotulo="andamento"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="instalador-preenchimento" class="progresso-preenchimento"></div>
        </div>
        <p class="progresso-linha" id="instalador-linha"></p>
      </div>
      <p class="so-leitor" role="status" id="etapa-viva"></p>
    </section>

    <section data-passo="falha" hidden>
      <div role='alert'>
        <h2 tabindex="-1" id="falha-titulo"></h2>
        <p class="texto-2" id="falha-oque"></p>
      </div>
      <!-- o stderr do uv ou do jobot, para quem for diagnosticar -->
      <details class="falha-detalhe" id="falha-detalhe" hidden>
        <summary data-t="falha.detalhe"></summary>
        <pre id="falha-detalhe-texto"></pre>
      </details>
    </section>

    <section data-passo="pronto" hidden>
      <h2 tabindex="-1" data-t="pronto.titulo"></h2>
      <p class="texto-2" data-t="etapa.abrir"></p>
    </section>

    <section data-passo="incompleto" hidden>
      <div role='alert'>
        <h2 tabindex="-1" data-t="incompleto.titulo"></h2>
        <p class="texto-2" data-t="incompleto.texto"></p>
      </div>
    </section>
  </div>
  <!-- a ordem do DOM é a visual: o Tab anda como os olhos (WCAG 2.4.3) -->
  <div class="instalador-pe">
    <button type="button" id="voltar" class="botao-simples instalador-voltar" data-t="voltar" hidden></button>
    <button type="button" id="continuar" class="botao-principal" data-t="continuar" hidden></button>
    <button type="button" id="instalar" class="botao-principal" data-t="instalar" hidden></button>
    <button type="button" id="sem-navegador" class="botao-simples" data-t="sem_navegador" hidden></button>
    <button type="button" id="tentar" class="botao-principal" data-t="tentar" hidden></button>
  </div>
</main>

<dialog id="alerta-fechar" class="alerta vidro-grande vidro-elevado" aria-labelledby="alerta-titulo"
  aria-describedby="alerta-texto">
  <div class="alerta-corpo">
    <p class="alerta-titulo" id="alerta-titulo" data-t="alerta.titulo"></p>
    <p class="alerta-texto" id="alerta-texto" data-t="alerta.texto"></p>
  </div>
  <!-- visual do Mac (Alerta): a ação em cima, o cancelar embaixo, nenhum botão padrão -->
  <div class="alerta-acoes">
    <button type="button" id="alerta-parar" data-t="alerta.parar"></button>
    <button type="button" id="alerta-continuar" data-t="alerta.continuar"></button>
  </div>
</dialog>
<script src="instalador.js"></script>
</body>
</html>
