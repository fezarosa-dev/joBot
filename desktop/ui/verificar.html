<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joBot</title>
<!-- Desenho 5.4: antes do painel, confere se a janela tem o CSS que ele usa. Sem light-dark()
     aqui: esta página precisa abrir também no WebKitGTK velho que ela detecta. -->
<style>
  :root { color-scheme: light dark; --fundo: #f5f5f7; --texto: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #000000; --texto: #a1a1a6; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--fundo); color: var(--texto);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag;
  }
</style>
</head>
<body>
<p role="status" id="abrindo">Abrindo o joBot…</p>
<script>
  (function () {
    var ingles = !/^pt\b/i.test(navigator.language || "");
    if (ingles) {
      document.documentElement.lang = "en";
      document.getElementById("abrindo").textContent = "Opening joBot…";
    }
    var css = window.CSS && CSS.supports ? CSS.supports.bind(CSS) : function () { return false; };
    var falta = [];
    if (!css("color", "light-dark(#000, #fff)")) falta.push("light-dark");
    if (!("popover" in HTMLElement.prototype)) falta.push("popover");
    if (!css("anchor-name", "--a")) falta.push("anchor-name");
    if (!css("container-type", "inline-size")) falta.push("container-type");
    // a casca lê este endereço (main.rs, aviso_local) e não deixa a navegação acontecer
    location.href = falta.length ? "/__jobot/janela?falta=" + falta.join(",") : "/__jobot/janela?ok=1";
  })();
</script>
</body>
</html>
